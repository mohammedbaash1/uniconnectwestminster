<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Uni-Connect</title>
    <style>
        :root {
            --primary: #8b35f7;
            --bg: #f9fafb;
            --text-main: #111827;
            --text-muted: #6b7280;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            background: white;
            padding: 15px 40px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }

        .logo-icon {
            background: var(--primary);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .graduation-icon {
            background: var(--primary);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
            box-shadow: 0 8px 16px rgba(139, 53, 247, 0.3);
        }

        h1 { font-size: 24px; margin-bottom: 8px; color: var(--text-main); }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; }

        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            box-sizing: border-box;
            background: #fdfdfd;
            font-size: 14px;
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }

        .footer-text { font-size: 13px; color: var(--text-muted); margin-top: 20px; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo-icon">U</div> Uni-Connect Westminster
    </div>

    <div class="main-content">
        <div class="auth-card">
            <div class="graduation-icon">🎓</div>
            <h1>Create Account</h1>
            <p class="subtitle">Join the Westminster student community</p>

            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>Westminster Email</label>
                    <input type="email" id="email" placeholder="name@westminster.ac.uk" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Create a password" required>
                </div>
                <button type="submit" class="btn-submit">Create account</button>
            </form>

            <p class="footer-text">Already have an account? <a href="/login" style="color:var(--primary); text-decoration:none; font-weight:600;">Log in</a></p>
        </div>
    </div>

    <!-- SCRIPT PLACED AT THE BOTTOM FOR SUCCESSFUL FORM BINDING -->
    <script src="/js/auth.js"></script>
</body>
</html>
