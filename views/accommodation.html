<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accommodation Browser - Uni-Connect</title>
    <style>
        :root { --primary: #8b35f7; --bg: #f9fafb; --text-main: #111827; --text-muted: #6b7280; --green: #10b981; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); margin: 0; color: var(--text-main); }
        .navbar { background: white; padding: 15px 40px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; }
        .logo-icon { background: var(--primary); color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .header { margin-bottom: 30px; }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        
        /* Filter Bar */
        .filters { background: white; padding: 20px; border-radius: 16px; border: 1px solid #eee; display: flex; gap: 20px; margin-bottom: 30px; align-items: center; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; flex: 1; }
        .filter-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
        select { padding: 10px; border-radius: 8px; border: 1px solid #ddd; background: #fafafa; }

        /* Accommodation Cards */
        .list { display: flex; flex-direction: column; gap: 20px; }
        .acc-card { background: white; border-radius: 16px; border: 1px solid #eee; padding: 20px; display: flex; gap: 20px; transition: 0.3s; }
        .acc-card:hover { box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .icon-box { width: 48px; height: 48px; background: #ecfdf5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .info { flex: 1; }
        .info h3 { margin: 0 0 5px 0; font-size: 18px; }
        .info p { margin: 0; color: var(--text-muted); font-size: 14px; }
        .tags { display: flex; gap: 8px; margin-top: 15px; }
        .tag { background: #f3f4f6; color: var(--primary); font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
        .price-box { text-align: right; }
        .price { font-size: 20px; font-weight: 800; color: var(--primary); }
        .per-week { font-size: 11px; color: var(--text-muted); }
        .bookmark { margin-top: 20px; color: #ccc; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><div class="logo-icon">U</div> Uni-Connect Westminster</div>
        <a href="/dashboard" style="text-decoration:none; color:var(--text-muted); font-weight:600;">Dashboard</a>
    </nav>

    <div class="container">
        <div class="header">
            <h1>Accommodation Browser</h1>
            <p style="color:var(--text-muted)">Browse student-friendly accommodation near Westminster</p>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>Location</label>
                <select><option>All Locations</option></select>
            </div>
            <div class="filter-group">
                <label>Weekly Price</label>
                <select><option>£100 - £400</option></select>
            </div>
            <div class="filter-group">
                <label>Room Type</label>
                <select><option>All Types</option></select>
            </div>
        </div>

        <div id="loading" style="text-align:center; padding:40px;">Loading accommodation...</div>
        <div id="accommodationList" class="list"></div>
    </div>

    <script src="/js/accommodation.js"></script>
</body>
</html>
