<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Community - Uni-Connect</title>
    <style>
        :root { --primary: #8b35f7; --bg: #f9fafb; --text-main: #111827; --text-muted: #6b7280; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); margin: 0; }
        .navbar { background: white; padding: 15px 40px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; }
        .logo-icon { background: var(--primary); color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .header { margin-bottom: 40px; }
        
        .comm-card { background: white; border-radius: 16px; border: 1px solid #eee; padding: 25px; display: flex; align-items: center; gap: 20px; margin-bottom: 15px; }
        .comm-icon { width: 50px; height: 50px; background: #f5f3ff; color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .comm-info { flex: 1; }
        .comm-info h3 { margin: 0 0 5px 0; font-size: 18px; }
        .comm-info p { margin: 0; color: var(--text-muted); font-size: 14px; }
        .category-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--primary); margin-bottom: 5px; display: block; }
        .join-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid #eee; background: white; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .join-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><div class="logo-icon">U</div> Uni-Connect Westminster</div>
        <a href="/dashboard" style="text-decoration:none; color:var(--text-muted); font-weight:600;">Dashboard</a>
    </nav>

    <div class="container">
        <div class="header">
            <h1 style="font-size: 32px; font-weight: 800;">Find Your Community</h1>
            <p style="color:var(--text-muted)">Discover societies, clubs, and events that match your interests</p>
        </div>

        <div id="loading" style="text-align:center; padding:40px;">Loading communities...</div>
        <div id="communitiesList"></div>
    </div>

    <script src="/js/communities.js"></script>
</body>
</html>
